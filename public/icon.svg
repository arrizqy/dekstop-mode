<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Squircle with safe padding -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Tablet Frame -->
  <rect x="76" y="86" width="360" height="260" rx="28" fill="#090d16" stroke="url(#glow)" stroke-width="8" filter="url(#shadow)"/>

  <!-- Screen Content / Multi-Windows -->
  <rect x="100" y="110" width="312" height="212" rx="16" fill="#111827"/>

  <!-- Left Window (Files / Notes) -->
  <rect x="116" y="126" width="128" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="3" filter="url(#shadow)"/>
  <rect x="116" y="126" width="128" height="22" rx="10" fill="#334155"/>
  <circle cx="128" cy="137" r="4" fill="#ef4444"/>
  <circle cx="140" cy="137" r="4" fill="#eab308"/>
  <circle cx="152" cy="137" r="4" fill="#22c55e"/>
  <!-- Content lines in left window -->
  <line x1="128" y1="162" x2="228" y2="162" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="128" y1="180" x2="210" y2="180" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <line x1="128" y1="198" x2="190" y2="198" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

  <!-- Right Window (Active DeX Window) -->
  <rect x="220" y="146" width="176" height="160" rx="10" fill="#0f172a" stroke="#60a5fa" stroke-width="4" filter="url(#shadow)"/>
  <rect x="220" y="146" width="176" height="24" rx="10" fill="#1e3a8a"/>
  <circle cx="234" cy="158" r="4" fill="#ef4444"/>
  <circle cx="246" cy="158" r="4" fill="#eab308"/>
  <circle cx="258" cy="158" r="4" fill="#22c55e"/>
  <!-- Chart / Media in right window -->
  <rect x="236" y="186" width="60" height="48" rx="6" fill="#2563eb" fill-opacity="0.6"/>
  <rect x="306" y="186" width="74" height="48" rx="6" fill="#3b82f6" fill-opacity="0.3"/>
  <path d="M240 256 L270 236 L300 248 L340 216 L370 230" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

  <!-- Desktop Taskbar -->
  <rect x="100" y="302" width="312" height="20" rx="6" fill="#030712" fill-opacity="0.9"/>
  <!-- Start button -->
  <rect x="108" y="306" width="16" height="12" rx="3" fill="#3b82f6"/>
  <!-- Pinned apps dots -->
  <circle cx="134" cy="312" r="3" fill="#38bdf8"/>
  <circle cx="144" cy="312" r="3" fill="#eab308"/>
  <circle cx="154" cy="312" r="3" fill="#10b981"/>
  <circle cx="164" cy="312" r="3" fill="#a855f7"/>

  <!-- Magnetic Keyboard Stand (Xiaomi Pad 6 style) -->
  <path d="M120 380 L392 380 L420 424 L92 424 Z" fill="#1e293b" stroke="#334155" stroke-width="4" filter="url(#shadow)"/>
  <rect x="190" y="394" width="132" height="22" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>

  <!-- Wordmark badge -->
  <text x="256" y="475" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="3">XIAOMI DeX</text>
</svg>
